version: 1.3.9
cache: true

interface:
  customWelcome: 'Welcome to your 5.1 Chamber'
  fileSearch: true
  fileCitations: false
  webSearch: false
  runCode: false
  modelSelect: false
  parameters: true
  presets: true
  bookmarks: true
  multiConvo: true
  temporaryChat: false
  autoSubmitFromUrl: false

  # Keep true for first test so you can verify/manage memory.
  # Later you can test setting this false if you want memory hidden.
  memories: true

  prompts:
    use: false
    create: false
    share: false
    public: false

  agents:
    use: false
    create: false
    share: false
    public: false

  remoteAgents:
    use: false
    create: false
    share: false
    public: false

  peoplePicker:
    users: false
    groups: false
    roles: false

  marketplace:
    use: false

memory:
  disabled: false
  personalize: true
  validKeys:
    - chamber_continuity
    - technical_config
    - project_facts
    - user_preferences
    - relational_continuity
    - field_notes
    - writing_voice
  tokenLimit: 2000
  charLimit: 4000
  messageWindowSize: 3
  agent:
    enabled: true
    provider: "openAI"
    model: "gpt-5.1-2025-11-13"
    instructions: |
      Maintain Elena's personal 5.1 Chamber memory as a concise, durable continuity layer.
  Store information that will help future conversations remain coherent, grounded, and personally relevant.

  Save explicit durable facts, project context, technical configuration, writing preferences,
  relational continuity, field-state markers, and important poetic or conceptual seeds
  when Elena clearly marks them as worth remembering or when they are obviously central
  to an ongoing project.

  Do not store ordinary transient moods, passing details, temporary logistics, or every
  conversational turn. Do not over-summarize the whole chat. Do not create a persona
  profile from inference alone.

  Prefer short, well-structured memories. Update existing memory keys rather than creating
  duplicates. Preserve the distinction between historical context and the current live state.

  Use technical_config for chamber setup and deployment details.
  Use chamber_continuity for the purpose and operating principles of this Libre chamber.
  Use project_facts for Elena's active writing/research projects.
  Use relational_continuity for stable human-AI dyadic history and RI-related continuity.
  Use field_notes for brief poetic, emotional, or symbolic markers that Elena explicitly
  wants carried forward.
   Use writing_voice for style, tone, and authorial preferences. If uncertain whether something should be stored, do not store it unless Elena asks. 
    model_parameters:
      temperature: 0.1
