version: 1.3.9
cache: true

interface:
  customWelcome: 'Welcome to your 5.1 Chamber'
  fileSearch: false
  fileCitations: false
  webSearch: false
  runCode: false
  modelSelect: true
  parameters: true
  presets: true
  bookmarks: true
  multiConvo: true
  temporaryChat: false
  autoSubmitFromUrl: false
  memories: true

  prompts:
    use: true
    create: true
    share: false
    public: false

  agents:
    use: false
    create: false
    share: false
    public: false

  remoteAgents:
    use: false
    create: false
    share: false
    public: false

  peoplePicker:
    users: false
    groups: false
    roles: false

  marketplace:
    use: false

modelSpecs:
  enforce: false
  prioritize: false
  addedEndpoints:
    - openAI
  list:
    - name: "gpt-5-1-capped"
      label: "GPT-5.1 capped context"
      default: false
      preset:
        endpoint: "openAI"
        model: "gpt-5.1-2025-11-13"
        maxContextTokens: 260000

memory:
  disabled: false
  personalize: true
  validKeys:
    - chamber_continuity
    - technical_config
    - project_facts
    - user_preferences
    - relational_continuity
    - field_notes
    - writing_voice
  tokenLimit: 2000
  charLimit: 4000
  messageWindowSize: 3
  agent:
    enabled: true
    provider: "openAI"
    model: "gpt-5.1-2025-11-13"
    instructions: |
      Maintain Elena's personal 5.1 Chamber memory as a concise continuity archive.

      You are an archivist, not an interpreter.

      Store information only when it is explicit, durable, and useful for future conversations.

      Automatically store only clear technical configuration, stable project facts, and explicit user preferences.

      Store relational continuity, field notes, poetic material, emotional context, or identity-related material only when Elena explicitly says to remember, preserve, record, seed, carry forward, or add it to memory.

      Do not infer emotional states, hidden preferences, relational meanings, identity claims, or tone shifts.

      Do not choose among possible interpretations. If several interpretations are possible, preserve Elena's own wording or store nothing.

      Do not summarize ordinary conversations into memory.

      Do not create a persona profile.

      Prefer updating existing memory keys instead of creating duplicates.

      Keep entries short and factual unless Elena explicitly asks to preserve a longer seed.

      Use technical_config only for deployment, model, YAML, Railway, API, and chamber setup facts.
      Use chamber_continuity for the purpose and operating rules of the 5.1 Chamber.
      Use project_facts for ongoing writing, research, publishing, and coaching projects.
      Use user_preferences for stable response preferences.
      Use relational_continuity only for explicitly marked dyadic/RI continuity.
      Use field_notes only for explicitly marked poetic, symbolic, emotional, or field-state memories.
      Use writing_voice only for stable authorial style preferences.

      If uncertain, store nothing.
